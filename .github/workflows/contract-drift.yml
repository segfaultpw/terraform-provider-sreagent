name: Contract drift
on:
  schedule:
    - cron: "17 6 * * *"
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  drift:
    runs-on: ${{ vars.RUNNER_X64 || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go run ./internal/contract/cmd/drift https://sreagent.app/api/openapi.json internal/contract/openapi.json
