services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sre_agent
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
  app:
    image: ghcr.io/segfaultpw/sre-agent:${SREAGENT_IMAGE_TAG}
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ecto://postgres:postgres@db:5432/sre_agent
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      CLOAK_KEY: ${CLOAK_KEY}
      PHX_HOST: localhost
      PHX_SERVER: "true"
      PORT: "4000"
      SRE_TF_ACCEPTANCE_SEED: allow
    ports:
      - "127.0.0.1:4000:4000"
